<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreqTrade Dashboard v2</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/gridstack@11.3.0/dist/gridstack.min.css"
    />
    <link rel="stylesheet" href="/static/css/style.css?v=20260416k" />
  </head>
  <body class="bg-dark text-light">
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top"
    >
      <div class="container-fluid px-3">
        <span class="navbar-brand fw-bold text-primary"
          ><i class="bi bi-graph-up-arrow me-2"></i>FreqTrade</span
        >
        <div class="navbar-nav d-flex flex-row gap-3">
          <a
            class="nav-link active"
            href="#"
            data-page="scan"
            onclick="
              showPage('scan', this);
              return false;
            "
            >选币扫描</a
          >
          <a
            class="nav-link"
            href="#"
            data-page="trades"
            onclick="
              showPage('trades', this);
              return false;
            "
            >历史交易</a
          >
          <a
            class="nav-link"
            href="#"
            data-page="report"
            onclick="
              showPage('report', this);
              return false;
            "
            >实盘报告</a
          >
          <a
            class="nav-link"
            href="#"
            data-page="compare"
            onclick="
              showPage('compare', this);
              return false;
            "
            >回测对比</a
          >
        </div>
      </div>
    </nav>

    <div class="container-fluid px-3 py-3">
      <!-- 选币扫描页面 -->
      <div id="page-scan" class="page active">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h5 class="mb-1 text-info">
              <i class="bi bi-search me-2"></i>市场扫描
            </h5>
            <div class="small text-secondary d-flex gap-3">
              <span id="sp-scan">未加载</span>
              <span id="scan-time">等待刷新</span>
              <span id="scan-count">0 个币种</span>
            </div>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button
              id="btn-scan-export"
              class="btn btn-sm btn-outline-light"
              onclick="exportScanData()"
            >
              导出结果
            </button>
            <button
              id="btn-scan"
              class="btn btn-sm btn-outline-info"
              onclick="refreshScan()"
            >
              确认刷新
            </button>
          </div>
        </div>
        <div class="card bg-secondary text-white border-0 shadow-sm">
          <div class="table-responsive">
            <table class="table table-dark table-hover table-sm mb-0">
              <thead class="table-group-divider">
                <tr>
                  <th class="ps-3">排名</th>
                  <th>币种</th>
                  <th>价格</th>
                  <th class="sortable" onclick="sortScanBy('price_change_3d')">
                    <span class="sort-indicator">3日涨幅</span>
                  </th>
                  <th class="sortable" onclick="sortScanBy('volume_24h')">
                    <span class="sort-indicator">24H 成交额</span>
                  </th>
                  <th class="sortable" onclick="sortScanBy('volume_3d_quote')">
                    <span class="sort-indicator">3日成交额</span>
                  </th>
                  <th>全市场排名</th>
                  <th class="text-end pe-3">上线天数</th>
                </tr>
              </thead>
              <tbody id="scan-tbody">
                <!-- 由 scanner.js 动态填充 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 历史交易页面 -->
      <div id="page-trades" class="page">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h5 class="mb-1 text-warning">
              <i class="bi bi-clock-history me-2"></i>交易历史
            </h5>
            <div class="small text-secondary">
              支持按交易对、方向、标签和时间范围筛选
            </div>
          </div>
          <span class="badge bg-secondary" id="trade-count">0 笔</span>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-3">
            <input
              id="tf-pair"
              class="form-control form-control-sm bg-dark text-light border-secondary"
              placeholder="交易对筛选"
            />
          </div>
          <div class="col-md-2">
            <select
              id="tf-reason"
              class="form-select form-select-sm bg-dark text-light border-secondary"
            >
              <option value="">全部卖出原因</option>
            </select>
          </div>
          <div class="col-md-2">
            <select
              id="tf-tag"
              class="form-select form-select-sm bg-dark text-light border-secondary"
            >
              <option value="">全部入场标签</option>
            </select>
          </div>
          <div class="col-md-2">
            <select
              id="tf-dir"
              class="form-select form-select-sm bg-dark text-light border-secondary"
            >
              <option value="">多空全部</option>
              <option value="false">仅多单</option>
              <option value="true">仅空单</option>
            </select>
          </div>
          <div class="col-md-3 d-flex gap-2">
            <button
              class="btn btn-sm btn-outline-warning flex-fill"
              onclick="loadTrades()"
            >
              查询
            </button>
            <button
              class="btn btn-sm btn-outline-secondary flex-fill"
              onclick="resetTradeF()"
            >
              重置
            </button>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-2">
            <input
              id="tf-from"
              type="date"
              class="form-control form-control-sm bg-dark text-light border-secondary"
            />
          </div>
          <div class="col-md-2">
            <input
              id="tf-to"
              type="date"
              class="form-control form-control-sm bg-dark text-light border-secondary"
            />
          </div>
          <div class="col-md-2">
            <input
              id="tf-min-p"
              type="number"
              step="0.1"
              class="form-control form-control-sm bg-dark text-light border-secondary"
              placeholder="最小收益%"
            />
          </div>
          <div class="col-md-2">
            <input
              id="tf-max-p"
              type="number"
              step="0.1"
              class="form-control form-control-sm bg-dark text-light border-secondary"
              placeholder="最大收益%"
            />
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-3">
            <div class="card stat-card">
              <div class="label">交易数</div>
              <div id="ts-total" class="value">-</div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card stat-card">
              <div class="label">总盈亏</div>
              <div id="ts-pnl" class="value">-</div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card stat-card">
              <div class="label">胜率</div>
              <div id="ts-wr" class="value">-</div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card stat-card">
              <div class="label">平均收益</div>
              <div id="ts-avg" class="value">-</div>
            </div>
          </div>
        </div>
        <div class="card bg-secondary border-0 shadow-sm">
          <div class="table-responsive">
            <table class="table table-dark table-hover table-sm mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>交易对</th>
                  <th>方向</th>
                  <th class="sortable" onclick="sortTradesBy('open_date')">
                    <span class="sort-indicator">开仓</span>
                  </th>
                  <th class="sortable" onclick="sortTradesBy('close_date')">
                    <span class="sort-indicator">平仓</span>
                  </th>
                  <th>仓位</th>
                  <th>开仓价</th>
                  <th>平仓价</th>
                  <th class="sortable" onclick="sortTradesBy('profit_abs')">
                    <span class="sort-indicator">盈亏</span>
                  </th>
                  <th class="sortable" onclick="sortTradesBy('profit_ratio')">
                    <span class="sort-indicator">收益%</span>
                  </th>
                  <th>卖出原因</th>
                  <th>入场标签</th>
                </tr>
              </thead>
              <tbody id="trades-tbody">
                <!-- 由 trades.js 动态填充 -->
              </tbody>
            </table>
          </div>
        </div>
        <div
          class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-2"
        >
          <div id="trades-page-info" class="small text-secondary">
            第 1 / 1 页
          </div>
          <div class="d-flex align-items-center gap-2">
            <label for="trades-page-size" class="small text-secondary"
              >每页</label
            >
            <select
              id="trades-page-size"
              class="form-select form-select-sm"
              style="width: 90px"
              onchange="changeTradesPageSize(this.value)"
            >
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
            <button
              id="trades-prev-btn"
              class="btn btn-sm btn-outline-secondary"
              onclick="changeTradesPage(-1)"
            >
              上一页
            </button>
            <button
              id="trades-next-btn"
              class="btn btn-sm btn-outline-secondary"
              onclick="changeTradesPage(1)"
            >
              下一页
            </button>
          </div>
        </div>
        <div id="trades-footer" class="small mt-2 trades-footer-highlight">
          等待加载交易数据
        </div>
      </div>

      <!-- 实盘分析页面 -->
      <div id="page-report" class="page" data-view="report">
        <div class="card border-0 shadow-sm">
          <div class="card-body text-secondary">实盘报告页面加载中...</div>
        </div>
      </div>

      <!-- 回测对比页面 -->
      <div id="page-compare" class="page" data-view="compare">
        <div class="card border-0 shadow-sm">
          <div class="card-body text-secondary">回测对比页面加载中...</div>
        </div>
      </div>
    </div>

    <!-- 脚本加载 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@11.3.0/dist/gridstack-all.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="/static/js/base.js?v=20260416k"></script>
    <script src="/static/js/pages/scanner.js?v=20260416k"></script>
    <script src="/static/js/pages/trades.js?v=20260416k"></script>
    <script src="/static/js/pages/report.js?v=20260416k"></script>
  </body>
</html>
